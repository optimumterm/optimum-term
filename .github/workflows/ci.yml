name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo install --locked cargo-zigbuild

      - run: cargo fmt --all --check
      - run: cargo-zigbuild clippy --target $env:TARGET --workspace --all-targets -- -D warnings
      - run: cargo-zigbuild test --target $env:TARGET --workspace

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p optimum

      - name: Bundle
        run: |
          installer/macos/bundle.sh 0.1.0 target/release/optimum dist
          ditto -c -k --keepParent dist/Optimum.app dist/Optimum-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: optimum-macos
          path: dist/Optimum-macos.zip
