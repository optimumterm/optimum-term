name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false

      - id: next
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' Cargo.toml)
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          version="$base.$(( ${last:--1} + 1 ))"
          gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes; done
          gh release create "v$version" --draft --target "$SHA" --title "Optimum $version" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SHA }}
          submodules: true
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - run: cargo install --locked cargo-zigbuild

      - shell: bash
        run: scripts/fetch-conpty.sh

      - shell: bash
        run: sed -i 's/^version = ".*"$/version = "${{ needs.version.outputs.version }}"/' Cargo.toml

      - run: cargo-zigbuild build --release --target $env:TARGET -p optimum

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup hash mismatch: $hash" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\inno" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\inno\ISCC.exe")) { throw "ISCC.exe not found" }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$version" "/O$pwd\dist" installer\optimum.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash dist\Optimum.exe -Algorithm SHA256).Hash.ToLower() + "  Optimum.exe" | Out-File -Encoding ascii dist\Optimum.exe.sha256

      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/Optimum.exe

      - shell: bash
        run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/Optimum.exe.sigstore.json
          gh release upload "v${{ needs.version.outputs.version }}" dist/Optimum.exe dist/Optimum.exe.sha256 dist/Optimum.exe.sigstore.json

  macos:
    needs: version
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SHA }}
          submodules: true
          persist-credentials: false

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - run: sed -i '' 's/^version = ".*"$/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - run: cargo build --release -p optimum

      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Package
        run: |
          version="${{ needs.version.outputs.version }}"
          installer/macos/bundle.sh "$version" target/release/optimum dist
          installer/macos/dmg.sh dist/Optimum.app dist/Optimum.dmg
          (cd dist && shasum -a 256 Optimum.dmg > Optimum.dmg.sha256)

      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/Optimum.dmg

      - run: |
          cp "${{ steps.provenance.outputs.bundle-path }}" dist/Optimum.dmg.sigstore.json
          gh release upload "v${{ needs.version.outputs.version }}" dist/Optimum.dmg dist/Optimum.dmg.sha256 dist/Optimum.dmg.sigstore.json

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false

      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: Optimum.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - run: gh release download "$TAG" --dir dist --pattern Optimum.exe --pattern Optimum.dmg

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/Optimum.exe
            dist/Optimum.dmg
          sbom-path: Optimum.spdx.json

      - run: gh release upload "$TAG" Optimum.spdx.json

      - run: |
          tag="$TAG"
          gh release edit "$tag" --draft=false --latest
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            grep -vxF "$tag" |
            while read -r old; do gh release delete "$old" --yes; done
