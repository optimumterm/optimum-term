name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - run: cargo install --locked cargo-zigbuild

      - run: cargo-zigbuild test --target $env:TARGET --workspace
      - run: cargo-zigbuild build --release --target $env:TARGET -p optimum

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup hash mismatch: $hash" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\inno" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\inno\ISCC.exe")) { throw "ISCC.exe not found" }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $name = "optimum-$version-windows-x64"
          $out = "target\$env:TARGET\release"
          New-Item -ItemType Directory -Force -Path dist\$name | Out-Null
          Copy-Item "$out\optimum.exe", "$out\conpty.dll", "$out\OpenConsole.exe", LICENSE, THIRD_PARTY_NOTICES.md, README.md dist\$name
          Compress-Archive -Path dist\$name -DestinationPath dist\$name.zip
          $setup = "optimum-setup-$version.exe"
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$version" "/O$pwd\dist" installer\optimum.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($file in "$name.zip", $setup) {
            (Get-FileHash dist\$file -Algorithm SHA256).Hash.ToLower() + "  $file" | Out-File -Encoding ascii dist\$file.sha256
          }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  macos:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo test --workspace
      - run: cargo build --release -p optimum

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="Optimum-$version-macos-arm64.zip"
          installer/macos/bundle.sh "$version" target/release/optimum dist
          ditto -c -k --keepParent dist/Optimum.app "dist/$name"
          (cd dist && shasum -a 256 "$name" > "$name.sha256")

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
