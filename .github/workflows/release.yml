name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - id: next
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' Cargo.toml)
          last=$(git tag -l "v$base.*" | sed "s/^v$base\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          version="$base.$(( ${last:--1} + 1 ))"
          gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' |
            while read -r tag; do gh release delete "$tag" --yes; done
          gh release create "v$version" --draft --target "$SHA" --title "Optimum $version" --notes ""
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - run: cargo install --locked cargo-zigbuild

      - shell: bash
        run: sed -i 's/^version = ".*"$/version = "${{ needs.version.outputs.version }}"/' Cargo.toml

      - run: cargo-zigbuild build --release --target $env:TARGET -p optimum

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne "9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732") { throw "Inno Setup hash mismatch: $hash" }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/PORTABLE=1", "/DIR=$env:RUNNER_TEMP\inno" -Wait
          if (-not (Test-Path "$env:RUNNER_TEMP\inno\ISCC.exe")) { throw "ISCC.exe not found" }

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Q "/DAppVersion=$version" "/O$pwd\dist" installer\optimum.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash dist\Optimum.exe -Algorithm SHA256).Hash.ToLower() + "  Optimum.exe" | Out-File -Encoding ascii dist\Optimum.exe.sha256

      - shell: bash
        run: gh release upload "v${{ needs.version.outputs.version }}" dist/Optimum.exe dist/Optimum.exe.sha256

  macos:
    needs: version
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
          submodules: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - uses: dtolnay/rust-toolchain@stable

      - run: sed -i '' 's/^version = ".*"$/version = "${{ needs.version.outputs.version }}"/' Cargo.toml
      - run: cargo build --release -p optimum

      - name: Package
        run: |
          version="${{ needs.version.outputs.version }}"
          installer/macos/bundle.sh "$version" target/release/optimum dist
          installer/macos/dmg.sh dist/Optimum.app dist/Optimum.dmg
          (cd dist && shasum -a 256 Optimum.dmg > Optimum.dmg.sha256)

      - run: gh release upload "v${{ needs.version.outputs.version }}" dist/Optimum.dmg dist/Optimum.dmg.sha256

  publish:
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - run: |
          tag="v${{ needs.version.outputs.version }}"
          gh release edit "$tag" --draft=false --latest
          gh release list --limit 1000 --json tagName --jq '.[].tagName' |
            grep -vxF "$tag" |
            while read -r old; do gh release delete "$old" --yes; done
