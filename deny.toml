[graph]
targets = [
    "x86_64-pc-windows-gnu",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "reqwest", reason = "Optimum makes no network calls" },
    { name = "hyper", reason = "Optimum makes no network calls" },
    { name = "h2", reason = "Optimum makes no network calls" },
    { name = "ureq", reason = "Optimum makes no network calls" },
    { name = "curl", reason = "Optimum makes no network calls" },
    { name = "isahc", reason = "Optimum makes no network calls" },
    { name = "attohttpc", reason = "Optimum makes no network calls" },
    { name = "surf", reason = "Optimum makes no network calls" },
    { name = "tungstenite", reason = "Optimum makes no network calls" },
    { name = "rustls", reason = "Optimum makes no network calls" },
    { name = "native-tls", reason = "Optimum makes no network calls" },
    { name = "openssl", reason = "Optimum makes no network calls" },
    { name = "sentry", reason = "Optimum has no telemetry" },
    { name = "opentelemetry", reason = "Optimum has no telemetry" },
    { name = "posthog-rs", reason = "Optimum has no telemetry" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
